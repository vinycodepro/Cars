<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Car Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      color: #ff4d30;
      margin-bottom: 10px;
    }

    p.intro {
      text-align: center;
      color: #555;
      margin-bottom: 40px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .contact-info, .contact-form {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #ff4d30;
      margin-bottom: 15px;
    }

    .info-item {
      margin-bottom: 15px;
    }

    .info-item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 1rem;
    }

    form label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    form input:focus, form textarea:focus {
      border-color: #ff4d30;
      outline: none;
    }

    button {
      background-color: #ff4d30;
      color: white;
      border: none;
      padding: 12px 0;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #e04329;
    }

    iframe {
      width: 100%;
      height: 250px;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .contact-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Contact Us</h1>
    <p class="intro">We're here to help you find your dream car! Reach out to us for inquiries, bookings, or directions.</p>

    <div class="contact-grid">

      <!-- Contact Info -->
      <div class="contact-info">
        <h2>Our Location</h2>
        <div class="info-item">
          <strong>Address:</strong>
          123 Auto Drive, Motor City, Nairobi, Kenya
        </div>
        <div class="info-item">
          <strong>Phone:</strong>
          +254 114267785
        </div>
        <div class="info-item">
          <strong>Email:</strong>
          vincywebcarblaze@gmail.com
        </div>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.910517218099!2d36.82194631530805!3d-1.292065999051413!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x182f17316cbf9b77%3A0xeac3af8a2e03b12a!2sNairobi!5e0!3m2!1sen!2ske!4v1691879251234!5m2!1sen!2ske" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <!-- Contact Form -->
      <div class="contact-form">
        <h2>Send Us a Message</h2>
        <form action="#" method="POST">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />

          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />

          <label for="message">Your Message *</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>

    </div>
  </div>

</body>
</html>
